name: rajify
description: Native Flutter music discovery, library and YouTube player for Rajify.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  html_unescape: ^2.0.0
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.17.2
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
